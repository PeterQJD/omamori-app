<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2a4d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- "default" keeps the app below the status bar. "black-translucent" draws the app
       underneath it, and iOS 26 then blurs the top of the app's bar. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Omamori">
  <title>Omamori</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-side" id="topbar-left"></div>
    <h1 id="title">Omamori</h1>
    <div class="topbar-side right" id="topbar-right"></div>
  </header>

  <main id="view"></main>

  <div id="viewer" class="viewer" hidden>
    <div class="viewer-stage"><img alt=""></div>
    <p class="viewer-label"></p>
    <button type="button" class="viewer-close">Close</button>
    <p class="viewer-hint"></p>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="version.js"></script>
  <script src="db.js"></script>
  <script src="images.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
